<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKS | General Contractor Yogyakarta & Purbalingga</title>
<meta name="description" content="General Contractor Yogyakarta & Purbalingga. Build Beyond Limits.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0b1f4d;--gold:#f2a516;--ink:#fff;--glass:rgba(255,255,255,.12)}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--navy);
    display:flex;justify-content:center;padding:48px 20px;min-height:100%}
  .bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
  .shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(11,31,77,.55),rgba(11,31,77,.82))}
  main{width:100%;max-width:440px;text-align:center}
  .logo{width:128px;height:128px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;
    background:var(--navy);border:2px solid var(--gold);font-weight:800;font-size:30px;font-style:italic;color:var(--gold);overflow:hidden}
  .logo img{width:100%;height:100%;object-fit:contain;padding:16px}
  h1{font-size:22px;font-weight:800;letter-spacing:.2px}
  .tag{margin:4px auto 28px;font-size:15px;line-height:1.5;max-width:30ch;color:rgba(255,255,255,.88)}
  .tag b{color:var(--gold)}
  ul{list-style:none;padding:0;display:grid;gap:12px}
  a.link{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;color:var(--ink);text-decoration:none;
    background:var(--glass);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:background .2s,color .2s,transform .2s}
  a.link:hover,a.link:focus-visible{background:var(--gold);color:var(--navy);transform:translateY(-2px);outline:none}
  a.link:focus-visible{box-shadow:0 0 0 3px #fff}
  a.link svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .t{flex:1;text-align:center;font-weight:600;padding-right:22px}
  .t small{display:block;font-weight:400;font-size:12px;opacity:.85;margin-top:2px}
  footer{margin-top:28px;font-size:12px;opacity:.7}
  @media(prefers-reduced-motion:reduce){a.link{transition:none}}
</style>
</head>
<body>
<video class="bg" autoplay muted loop playsinline preload="auto" aria-hidden="true">
  <source src="background.mp4" type="video/mp4">
</video>
<div class="shade"></div>

<main>
  <div class="logo"><img src="logo.png" alt="Logo SKS" onerror="this.remove();this.parentNode.textContent='SKS'"></div>
  <p class="tag">General Contractor Yogyakarta & Purbalingga. <b>Build Beyond Limits.</b></p>

  <ul>
    <li><a class="link" href="https://maps.app.goo.gl/e6DaWGeQJen28ezw9" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span class="t">Lokasi Kami<small>Perenggamol, Balecatur, Sleman</small></span></a></li>
    <li><a class="link" href="https://wa.me/6282327779997" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
      <span class="t">WhatsApp</span></a></li>
    <li><a class="link" href="https://www.instagram.com/ptsksofficial/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6"/></svg>
      <span class="t">Instagram</span></a></li>
    <li><a class="link" href="https://www.tiktok.com/@ptsksofficial" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.4 2.6 2 4.2 5 4.5"/></svg>
      <span class="t">TikTok</span></a></li>
    <li><a class="link" href="https://ptsksjogja.com/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>
      <span class="t">Website Kami</span></a></li>
  </ul>

  <footer>© SKS General Contractor</footer>
</main>

<script>
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelector('.bg').pause();
</script>
</body>
</html>
